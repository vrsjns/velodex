services:
  localstack:
    image: localstack/localstack
    ports:
      - "4566:4566"
    environment:
      - SERVICES=s3
      - DEBUG=0
    volumes:
      - "./localstack-init:/etc/localstack/init/ready.d"
      - "localstack-data:/var/lib/localstack"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4566/_localstack/health"]
      interval: 5s
      timeout: 5s
      retries: 5

  postgres:
    image: postgres:16-alpine
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=velostrology
      - POSTGRES_PASSWORD=velostrology
      - POSTGRES_DB=velostrology
    volumes:
      - "postgres-data:/var/lib/postgresql/data"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U velostrology"]
      interval: 5s
      timeout: 5s
      retries: 5

  scraper:
    build: .
    depends_on:
      localstack:
        condition: service_healthy
      postgres:
        condition: service_healthy
    environment:
      - AWS_ACCESS_KEY_ID=test
      - AWS_SECRET_ACCESS_KEY=test
      - AWS_REGION=eu-central-1
      - S3_BUCKET_NAME=velo-horoscope-01
      - S3_ENDPOINT_URL=http://localstack:4566
      - SCRAPER_MAX_CONCURRENT=20
      - SCRAPER_REQUEST_DELAY=0.1
      - DB_URL=postgresql://velostrology:velostrology@postgres:5432/velostrology
    deploy:
      resources:
        limits:
          memory: 2G
    profiles:
      - run

  web:
    build:
      context: .
      dockerfile: Dockerfile.web
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      - DB_URL=postgresql://velostrology:velostrology@postgres:5432/velostrology
      - JWT_SECRET=dev-secret-change-in-production-env
      - ADMIN_EMAIL=admin@velodex.com
      - ADMIN_PASSWORD=admin
    profiles:
      - web

volumes:
  localstack-data:
  postgres-data:
